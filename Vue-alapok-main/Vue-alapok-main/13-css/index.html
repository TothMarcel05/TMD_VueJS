        <h1>Guitars</h1>
        <div class="guitars">
            <div v-for="guitar in guitars" :key="guitar.id">
                
                <h2> {{ guitar.name }}</h2>

                <span :class="{
                    'out-of-stock': guitar.stock === 0 ,
                    'instock': guitar.stock > 0 ,
                    'only-few-left': guitar.stock < 3 && guitar.stock > 0}">
                    {{guitar.stock}} in stock</span>

            </template>
        </div>
    </div>

    <script src="main.js"></script>
