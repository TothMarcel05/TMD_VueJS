<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Init Vue App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="appdiv">
        <h1>Guitars</h1>
        <div class="guitars">
            <template v-for="guitar in guitars" :key="guitar.id">
                
                <h2> {{ guitar.name }}</h2>

                <span v-if="guitar.stock  === 0"
                :style = "outOfStock">Out of stock</span>

                <span v-else-if="guitar.stock  < 3" 
                :style="onlyFewLeft">Last chance, only {{guitar.stock}}</span>

                <span v-else 
                :style="inStock">In stock</span>

            </template>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
